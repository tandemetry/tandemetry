[project]
name = "tandemetry"
version = "0.0.1"
description = "Self-hosted analytics for AI coding agents versus human-authored work."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yevhenii Korniev" }]
keywords = ["ai-agents", "analytics", "github", "code-review", "engineering-metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/tandemetry/tandemetry"
Repository = "https://github.com/tandemetry/tandemetry"
Documentation = "https://github.com/tandemetry/tandemetry/tree/main/docs"
Issues = "https://github.com/tandemetry/tandemetry/issues"

[project.scripts]
tandemetry = "tandemetry.cli:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
