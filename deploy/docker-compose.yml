name: tandemetry

x-app: &app
  image: tandemetry:dev
  build:
    context: ..
    dockerfile: Dockerfile
  profiles: [app]
  init: true
  stop_signal: SIGINT
  restart: on-failure:3
  environment: &app-environment
    TANDEMETRY_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
    TANDEMETRY_CLICKHOUSE__HOST: clickhouse
    TANDEMETRY_CLICKHOUSE__USERNAME: ${CLICKHOUSE_USER:?set in deploy/.env}
    TANDEMETRY_CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD:?set in deploy/.env}
    TANDEMETRY_CLICKHOUSE__DATABASE: ${CLICKHOUSE_DB:?set in deploy/.env}

x-github-secrets: &github-secrets
  env_file:
    - path: app.env
      required: false

services:
  migrate:
    <<: *app
    command: migrate
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy

  serve:
    <<: [*app, *github-secrets]
    command: serve
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-environment
      TANDEMETRY_API__HOST: 0.0.0.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  normalize:
    <<: [*app, *github-secrets]
    command: normalize
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consume:
    <<: *app
    command: consume
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in raw.github events.normalized events.attributed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions "$$TOPIC_PARTITIONS" --replication-factor 1
        done
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter \
          --entity-type topics --entity-name raw.github --add-config max.message.bytes=33554432
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set in deploy/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in deploy/.env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?set in deploy/.env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17.11
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
